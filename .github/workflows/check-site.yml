name: Comprobar sitio publicado
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check-html:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/check_site.py
