<!-- Chatbot Widget Embed (Chatbase) -->
<script>
// Los mapas y gráficos en pestañas ocultas necesitan recalcular su tamaño.
document.addEventListener("shown.bs.tab", function () {
  window.dispatchEvent(new Event("resize"));
  document.querySelectorAll(".leaflet.html-widget").forEach(function (element) {
    if (element.offsetWidth && window.HTMLWidgets) {
      const widget = HTMLWidgets.find("#" + element.id);
      if (widget && widget.getMap) widget.getMap().invalidateSize();
    }
  });
});
</script>
<script>
  (function () {
    if (!window.chatbase || window.chatbase("getState") !== "initialized") {
      window.chatbase = (...arguments) => { if (!window.chatbase.q) { window.chatbase.q = [] } window.chatbase.q.push(arguments) };
      window.chatbase = new Proxy(window.chatbase, { get(target, prop) { if (prop === "q") { return target.q } return (...args) => target(prop, ...args) } })
    }
    const onLoad = function () {
      const script = document.createElement("script");
      script.src = "https://www.chatbase.co/embed.min.js";
      // Reemplaza TU_CHATBOT_ID por el identificador de tu bot en Chatbase
      script.id = "rCXwG1rrF9_SEtx0A-LDe";
      script.domain = "www.chatbase.co";
      document.body.appendChild(script)
    };
    if (document.readyState === "complete") { onLoad() } else { window.addEventListener("load", onLoad) }
  })();
</script>
